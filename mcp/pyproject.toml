[project]
name = "pizca-mcp"
version = "0.1.0"
description = "Servidor MCP local para usar Pizca desde Claude Desktop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.20,<2",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pizca-mcp = "pizca_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pizca_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
