<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Pizca{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&family=Ranchers&display=swap" rel="stylesheet">
  <style>
    :root {
      --mostaza: #BE9F00; --mostaza-texto: #7A6500; --marron: #3F3128; --tomate-texto: #B23A12;
      --crema: #FAECD2; --fondo: #FFF9EC; --texto2: #6B5A4E; --linea: #EADFC8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: var(--fondo); color: var(--marron);
      font: 16px/1.5 'Nunito Sans', system-ui, sans-serif;
    }
    main { width: 100%; max-width: 380px; }
    .marca { font-family: 'Ranchers', system-ui, sans-serif; font-size: 44px; letter-spacing: 1px; text-align: center; margin: 0 0 8px; }
    h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
    .sub { color: var(--texto2); text-align: center; margin: 0 0 24px; }
    label { display: block; font-weight: 700; margin: 16px 0 6px; }
    input[type=text], input[type=password], input[type=email] {
      width: 100%; padding: 12px 14px; border: 1px solid var(--linea); border-radius: 12px;
      background: var(--crema); color: var(--marron); font: inherit;
    }
    input:focus { outline: 2px solid var(--mostaza); outline-offset: 1px; }
    .boton {
      display: block; width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 999px;
      background: var(--mostaza); color: var(--marron); font: 700 16px 'Nunito Sans', system-ui, sans-serif; cursor: pointer;
    }
    .boton.secundario { background: transparent; border: 1px solid var(--linea); margin-top: 12px; }
    .error { color: var(--tomate-texto); background: #FDE8E0; border-radius: 12px; padding: 10px 14px; margin: 0 0 8px; }
    ul.permisos { background: var(--crema); border-radius: 12px; padding: 12px 16px 12px 32px; margin: 0; }
    .pie { color: var(--texto2); font-size: 14px; text-align: center; margin-top: 24px; }
    a { color: var(--mostaza-texto); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p class="marca">PIZCA</p>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
