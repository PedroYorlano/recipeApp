services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fogon
      POSTGRES_USER: fogon
      POSTGRES_PASSWORD: fogon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fogon" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: >
      sh -c "
        python manage.py collectstatic --noinput &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
      - /app/venv
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override DATABASE_URL para apuntar al servicio 'db' de Docker
      - DATABASE_URL=postgres://fogon:fogon@db:5432/fogon
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
